<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Navigation and Filters</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { overflow-x: hidden; }
img { display: block; width: 375px; height: auto; }

.nav-wrapper,
.nav,
.filters-wrapper,
.filters { width: 100%; }

/* The original elements always keep their place in the page. */
.nav-wrapper,
.filters-wrapper { position: relative; }

/* Keep the original elements in flow while their fixed copies take over. */
.original-header.is-replaced,
.filters-wrapper.is-replaced { visibility: hidden; }

/* Fixed copies preserve the original page layout while they are pinned. */
.fixed-stack {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    visibility: hidden;
    pointer-events: none;
}

.fixed-stack.is-active {
    visibility: visible;
    pointer-events: auto;
}

.fixed-nav {
    width: 100%;
    max-height: 0;
    overflow: hidden;
    transition: max-height 300ms ease;
}

.fixed-nav-content {
    width: 100%;
    transform: translateY(-100%);
    transition: transform 300ms ease;
}

.fixed-nav-bot {
    width: 100%;
}

.fixed-stack.nav-released .fixed-nav-content,
.fixed-stack.nav-released .fixed-nav-bot img {
    visibility: hidden;
}

.fixed-stack.nav-visible .fixed-nav {
    max-height: var(--nav-height, 0px);
}

.fixed-stack.nav-visible .fixed-nav-content {
    transform: translateY(0);
}

.fixed-filters {
    width: 100%;
    position: relative;
    display: none;
}

.fixed-stack.filters-active .fixed-filters {
    display: block;
}

.fixed-stack.filters-released .fixed-filters {
    display: none;
}

@media (prefers-reduced-motion: reduce) {
    .fixed-nav { transition: none !important; }
}
</style>
</head>
<body>
<div class="page">
    <div class="original-header" id="originalHeader">
        <img src="stripe.png" alt="">
        <div class="nav-wrapper" id="navWrapper">
            <div class="nav">
                <img src="nav-top.png" alt="">
                <img id="navBot" src="nav-bot.png" alt="">
            </div>
        </div>
    </div>

    <div class="scrolling-content">
        <img src="top.png" alt="">

        <div class="filters-wrapper" id="filtersWrapper">
            <div class="filters">
                <img src="filters.png" alt="">
            </div>
        </div>

        <img src="list.png" alt="">
    </div>
</div>

<!-- Independent fixed copies. The originals never animate or move off screen. -->
<div class="fixed-stack" id="fixedStack" aria-hidden="true">
    <div class="fixed-nav" id="fixedNav">
        <div class="fixed-nav-content">
            <img src="stripe.png" alt="">
            <img src="nav-top.png" alt="">
        </div>
    </div>
    <div class="fixed-nav-bot">
        <img id="fixedNavBotImage" src="nav-bot.png" alt="">
    </div>
    <div class="fixed-filters">
        <img src="filters.png" alt="">
    </div>
</div>

<script>
const navBot = document.getElementById('navBot');
const originalHeader = document.getElementById('originalHeader');
const filtersWrapper = document.getElementById('filtersWrapper');
const fixedStack = document.getElementById('fixedStack');
const fixedNav = document.getElementById('fixedNav');
const fixedNavContent = document.querySelector('.fixed-nav-content');
const fixedNavBot = document.querySelector('.fixed-nav-bot');
const fixedNavBotImage = document.getElementById('fixedNavBotImage');
const fixedFilters = document.querySelector('.fixed-filters');

let lastScrollY = window.scrollY;
let fixedMode = false;
let navIsVisible = false;
let navReleased = false;
let fixedFiltersActive = false;
let lastDirection = null;

function measure() {
    const navHeight = fixedNavContent.offsetHeight;
    document.documentElement.style.setProperty(
        '--nav-height',
        `${navHeight}px`
    );

    if (fixedMode) syncFiltersHandoff(lastDirection);
}

function activateFixedMode() {
    if (fixedMode) return;

    fixedMode = true;
    navIsVisible = false;
    navReleased = false;
    fixedFiltersActive = false;
    lastDirection = 'down';
    fixedNavBotImage.src = 'nav-bot-burger.png';

    originalHeader.classList.add('is-replaced');
    fixedStack.classList.remove(
        'nav-visible',
        'nav-released',
        'filters-active',
        'filters-released'
    );
    fixedStack.classList.add('is-active');
    fixedStack.setAttribute('aria-hidden', 'false');
}

function deactivateFixedMode() {
    if (!fixedMode) return;

    fixedMode = false;
    navIsVisible = false;
    navReleased = false;
    fixedFiltersActive = false;
    lastDirection = null;
    fixedNavBotImage.src = 'nav-bot.png';

    fixedStack.classList.remove(
        'is-active',
        'nav-visible',
        'nav-released',
        'filters-active',
        'filters-released'
    );
    fixedStack.setAttribute('aria-hidden', 'true');
    originalHeader.classList.remove('is-replaced');
    filtersWrapper.classList.remove('is-replaced');
}

function showNav() {
    if (!fixedMode || navIsVisible) return;
    navIsVisible = true;
    fixedStack.classList.add('nav-visible');
}

function hideNav() {
    if (!fixedMode || !navIsVisible) return;
    navIsVisible = false;
    fixedStack.classList.remove('nav-visible');
}


function releaseFiltersToPage() {
    if (!fixedMode || !fixedFiltersActive) return;

    fixedFiltersActive = false;
    filtersWrapper.classList.remove('is-replaced');
    fixedStack.classList.add('filters-released');
}

function restoreFixedFilters() {
    if (!fixedMode || fixedFiltersActive) return;

    fixedFiltersActive = true;
    filtersWrapper.classList.add('is-replaced');
    fixedStack.classList.remove('filters-released');
    fixedStack.classList.add('filters-active');
}

function syncFiltersHandoff(direction) {
    if (!fixedMode || !direction) return;

    const originalTop = filtersWrapper.getBoundingClientRect().top;
    const fixedTop = fixedFiltersActive
        ? fixedFilters.getBoundingClientRect().top
        : fixedNav.getBoundingClientRect().height + fixedNavBot.offsetHeight;

    if (direction === 'up' && fixedFiltersActive && originalTop >= fixedTop) {
        releaseFiltersToPage();
    }

    if (direction === 'down' && !fixedFiltersActive && originalTop <= fixedTop) {
        restoreFixedFilters();
    }
}

function syncNavHandoff(direction) {
    if (!fixedMode || !direction) return;

    const originalTop = navBot.getBoundingClientRect().top;
    const fixedTop = fixedNav.getBoundingClientRect().height;

    if (direction === 'up' && !navReleased && originalTop >= fixedTop) {
        navReleased = true;
        originalHeader.classList.remove('is-replaced');
        fixedStack.classList.add('nav-released');
    }

    if (direction === 'down' && navReleased && originalTop <= fixedTop) {
        navReleased = false;
        originalHeader.classList.add('is-replaced');
        fixedStack.classList.remove('nav-released');
    }

    if (direction === 'up' && navReleased && !fixedFiltersActive) {
        deactivateFixedMode();
    }
}

function handleScroll() {
    const currentScrollY = window.scrollY;
    const delta = currentScrollY - lastScrollY;

    if (Math.abs(delta) < 1) return;

    const direction = delta > 0 ? 'down' : 'up';

    if (!fixedMode && direction === 'down' &&
        navBot.getBoundingClientRect().top <= 0) {
        activateFixedMode();
    }

    if (fixedMode) {
        if (direction !== lastDirection) {
            fixedNavBotImage.src = direction === 'down'
                ? 'nav-bot-burger.png'
                : 'nav-bot.png';
            if (direction === 'up') showNav();
            else hideNav();
            lastDirection = direction;
        }

        syncNavHandoff(direction);
        syncFiltersHandoff(direction);
    }

    lastScrollY = currentScrollY;
}

window.addEventListener('scroll', handleScroll, { passive: true });
window.addEventListener('resize', measure);
window.addEventListener('load', measure);
measure();
</script>
</body>
</html>
